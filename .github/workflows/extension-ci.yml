name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest ruff
      - run: python -m pip install -e .
      - run: >-
          python -m ruff check
          src/vllm_hust_kv_tiering
          tests
      - run: >-
          python -m ruff format --check
          src/vllm_hust_kv_tiering
          tests
      - name: Importable without a vLLM runtime
        run: python -c "import vllm_hust_kv_tiering; print('ok')"
      - run: python -m build
