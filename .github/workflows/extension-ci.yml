name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools without accelerator dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src/vllm_hust_kv_tiering tests
      - name: Check formatting
        run: python -m ruff format --check src/vllm_hust_kv_tiering tests
      - name: Run portable safety and policy tests
        run: >-
          python -m pytest -q
          tests/test_policy.py
          tests/test_lifecycle_state.py
          tests/test_async_worker_safety.py
          tests/test_segment_store_safety.py
      - name: Check all-suite host guards without a host runtime
        run: python -m pytest -q tests -m 'not host and not npu'
      - name: Build sdist and wheel
        run: python -m build
      - name: Check source distribution contains operational documentation
        run: |
          python - <<'PY'
          import pathlib
          import tarfile

          with tarfile.open(next(pathlib.Path("dist").glob("*.tar.gz"))) as archive:
              names = archive.getnames()
          for relative in ("docs/configuration.md", "docs/architecture.md", "examples/pressure-tiering.json", "examples/cpu-only.json"):
              assert any(name.endswith("/" + relative) for name in names), relative
          PY
      - name: Install wheel into a clean no-dependency environment
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          expected_version="$(python -c 'import importlib.metadata; print(importlib.metadata.version("vllm-hust-kv-tiering"))')"
          EXPECTED_VERSION="$expected_version" .wheel-smoke/bin/python -I - <<'PY'
          import importlib.metadata
          import importlib.util
          import os
          import vllm_hust_kv_tiering

          distribution = importlib.metadata.distribution("vllm-hust-kv-tiering")
          assert distribution.version == os.environ["EXPECTED_VERSION"]
          assert any(ep.group == "vllm.general_plugins" for ep in distribution.entry_points)
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("vllm") is None
          print("clean-wheel root import and plugin discovery: ok")
          PY
